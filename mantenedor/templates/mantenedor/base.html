<!DOCTYPE html>
<html lang="es" data-bs-theme="light" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <title>Calificaciones Tributarias</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn-toolbar-custom { padding: 10px; border-radius: 5px; }
        .table th {
            white-space: nowrap; font-size: 0.8rem; position: relative;
            resize: horizontal; overflow: hidden; min-width: 80px; 
            max-width: 500px; border-right: 2px solid #ccc !important; 
        }
        .table td { white-space: nowrap; }
        .table-hover tbody tr { cursor: pointer; }
        #tablaPrincipal tbody tr.selected-row > td {
            color: #fff !important; background-color: #084298 !important; border-color: #052c65;
        }
        .table .filters td { padding: 2px; }
        .table .filters input, .table .filters select { 
            width: 100%; font-size: 0.75rem; border-radius: 0; box-sizing: border-box;
        }
        .table-footer { background-color: #f4f4f4; border-top: 1px solid #ddd; padding: 6px 12px; }
        .pagination-custom .page-link { border: none; background: transparent; color: #555; padding: 2px 6px; font-size: 0.85rem; }
        .pagination-custom .page-item.active .page-link { background-color: #336699; color: white; border-radius: 3px; }
        .pagination-custom .page-item.disabled .page-link { color: #adb5bd; }
    </style>
</head>
<body>
    <!-- Aquí se inyectará el contenido de cada página -->
    {% block content %}{% endblock %}

    <!-- Aquí se inyectarán los modales -->
    {% block modals %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Funciones Globales
        function toggleDarkMode() {
            const html = document.getElementById('htmlRoot');
            html.setAttribute('data-bs-theme', html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
        }
        function setZoom(percent) { document.body.style.zoom = percent + '%'; }
    </script>
    
    <!-- Aquí se inyectarán los scripts específicos de cada página -->
    {% block javascript %}{% endblock %}
</body>
</html>
