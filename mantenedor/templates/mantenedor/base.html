<!DOCTYPE html>
<html lang="es" data-bs-theme="light" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <title>Calificaciones Tributarias</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Script de inicialización rápida para evitar parpadeos de CSS -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const savedZoom = localStorage.getItem('zoom') || '100';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            document.documentElement.style.zoom = savedZoom + '%';
        })();
    </script>

    <style>
        .btn-toolbar-custom { padding: 10px; border-radius: 5px; }
        .table th {
            white-space: nowrap; font-size: 0.8rem; position: relative;
            resize: horizontal; overflow: hidden; min-width: 80px; 
            max-width: 500px; border-right: 2px solid var(--bs-border-color) !important; 
        }
        .table td { white-space: nowrap; }
        .table-hover tbody tr { cursor: pointer; }
        
        /* Fila seleccionada */
        #tablaPrincipal tbody tr.selected-row > td {
            color: #fff !important; 
            background-color: #084298 !important; 
            border-color: #052c65;
        }
        
        /* Variables dinámicas para Modo Oscuro/Claro */
        .table-footer { 
            background-color: var(--bs-tertiary-bg); 
            border-top: 1px solid var(--bs-border-color); 
            padding: 6px 12px; 
        }
        .pagination-custom .page-link { 
            border: none; 
            background: transparent; 
            color: var(--bs-body-color); 
            padding: 2px 6px; 
            font-size: 0.85rem; 
        }
        .pagination-custom .page-item.active .page-link { 
            background-color: #336699; 
            color: white; 
            border-radius: 3px; 
        }
        .pagination-custom .page-item.disabled .page-link { 
            color: var(--bs-secondary-color); 
        }
    </style>
</head>
<body>
    <!-- Aquí se inyectará el contenido de cada página -->
    {% block content %}{% endblock %}

    <!-- Aquí se inyectarán los modales -->
    {% block modals %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Funciones Globales con persistencia en localStorage
        function toggleDarkMode() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        function setZoom(percent) { 
            document.documentElement.style.zoom = percent + '%'; 
            localStorage.setItem('zoom', percent);
        }
    </script>
    
    <!-- Aquí se inyectarán los scripts específicos de cada página -->
    {% block javascript %}{% endblock %}
</body>
</html>
