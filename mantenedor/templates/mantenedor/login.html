<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Mantenedor Tributario NUAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login {
            width: 100%;
            max-width: 420px;
            border-radius: 8px;
            border-top: 5px solid #2b5a73;
        }
    </style>
</head>
<body>
    <div class="card card-login shadow-sm p-4 bg-white">
        <div class="text-center mb-4">
            <h4 class="fw-bold text-secondary mb-1">NUAM</h4>
            <span class="text-muted small">Mantenedor de Calificaciones Tributarias</span>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger py-2 small" role="alert">
                Usuario o contraseña incorrectos. Intente nuevamente.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label small fw-bold text-muted">Usuario</label>
                <input type="text" name="username" autofocus required class="form-control form-control-sm" id="id_username" placeholder="Ingrese su usuario">
            </div>

            <div class="mb-4">
                <label for="id_password" class="form-label small fw-bold text-muted">Contraseña</label>
                <input type="password" name="password" required class="form-control form-control-sm" id="id_password" placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-sm py-2 fw-bold" style="background-color: #2b5a73; border-color: #2b5a73;">
                INGRESAR AL SISTEMA
            </button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted" style="font-size: 0.75rem;">Acceso restringido a personal autorizado.</small>
        </div>
    </div>
</body>
</html>
